name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node --test tests/launcher-install.test.ts tests/launcher-runtime.test.ts

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Verify shipped skill artifacts
        run:
          git diff --exit-code -- skills/codex-ux-workspace/assets/runtime.json
          skills/codex-ux-video-editor/app.json skills/codex-ux-video-editor/dist
          skills/codex-ux-3d-space/app.json skills/codex-ux-3d-space/dist

  installed-skills:
    name: Installed skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select test browser
        shell: bash
        run:
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CODEX_UX_CHROME=" +
          require("@playwright/test").chromium.executablePath() + "\n")'
      - run: pnpm test:skills
